name: video_player
description: "Video Player Plugin for Ghosten Player"
version: 0.0.0

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  collection: ^1.19.0
  equatable: ^3.0.0
  flutter_cache_manager: ^3.4.5
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ghosten.videoplayer
        pluginClass: PlayerViewPlugin
      web:
        pluginClass: PlayerWeb
        fileName: src/player_web.dart
